<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>AS 快速報價</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAxYym5ZR8puPb0iiycHdwzTJTKH0Aears&libraries=places"></script>
  <style>
    :root {
      --primary: #553f62;
      --soft: #f5f1f7;
      --pink: #f07cad;
      --ink: #1f2937;
    }
    body { background: #f4f5f7; color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .focus-ring:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(85, 63, 98, .14); }
    .field { width: 100%; border: 1px solid #d9d6df; border-radius: 10px; padding: 10px 11px; background: #fff; font-size: 15px; }
    .label { display: block; font-size: 12px; color: #7a6a82; margin-bottom: 5px; }
    .card { background: #fff; border: 1px solid #e6e2ea; border-radius: 16px; box-shadow: 0 10px 24px rgba(31, 41, 55, .06); }
    .money-row { display: flex; justify-content: space-between; gap: 14px; padding: 5px 0; font-size: 14px; }
    .money-row.total { border-top: 1px solid #ece8ef; margin-top: 6px; padding-top: 12px; font-size: 18px; font-weight: 700; color: var(--primary); }
    .bottom-bar { position: sticky; bottom: 0; z-index: 20; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); background: rgba(244, 245, 247, .96); backdrop-filter: blur(10px); border-top: 1px solid #e5e7eb; }
  </style>
</head>
<body>
  <main class="max-w-md mx-auto min-h-screen pb-24">
    <header class="px-5 pt-5 pb-3 bg-white border-b border-gray-200">
      <div class="flex items-end justify-between gap-3">
        <div>
          <div class="text-2xl font-bold tracking-wide text-[#553f62]">AS 快速報價</div>
          <div class="text-xs text-gray-500 mt-1">客服手機快速試算，複製文字貼給客人</div>
        </div>
        <div class="text-[11px] text-gray-400" id="versionText"></div>
      </div>
    </header>
    <section class="p-4 space-y-4">
      <div class="card p-4 space-y-3">
        <div class="flex items-center justify-between">
          <h2 class="text-base font-semibold text-[#553f62]">報價條件</h2>
          <button id="btnReload" class="text-xs px-3 py-1.5 rounded-full border border-[#553f62]/30 text-[#553f62]">更新資料</button>
        </div>
        <div>
          <label class="label">客服 / 備註用</label>
          <input id="staffName" class="field focus-ring" placeholder="例如：星星">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="label">行程</label>
            <select id="serviceType" class="field focus-ring">
              <option value="送機">送機</option>
              <option value="接機">接機</option>
            </select>
          </div>
          <div>
            <label class="label">機場</label>
            <select id="airport" class="field focus-ring"></select>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="label">日期</label>
            <input id="rideDate" type="date" class="field focus-ring">
          </div>
          <div>
            <label class="label">時間</label>
            <input id="rideTime" type="time" class="field focus-ring" value="09:00">
          </div>
        </div>
        <div>
          <label class="label">主要地區</label>
          <input id="mainZone" list="zoneList" class="field focus-ring" placeholder="輸入或選擇，例如 300 新竹市東區">
          <datalist id="zoneList"></datalist>
        </div>
        <div>
          <label class="label">提供給客人的地址文字</label>
          <input id="mainAddress" class="field focus-ring" placeholder="例如：新竹市東區關新路">
        </div>
        <div>
          <label class="label">車型</label>
          <select id="carType" class="field focus-ring">
            <option value="小車">小車</option>
            <option value="大車">大車</option>
            <option value="進口商務車(SIENNA/BENZ V)">進口商務車</option>
            <option value="New Alphard 40">New Alphard 40</option>
          </select>
        </div>
        <div class="grid grid-cols-3 gap-3">
          <div>
            <label class="label">大人</label>
            <select id="adult" class="field focus-ring"></select>
          </div>
          <div>
            <label class="label">兒童</label>
            <select id="child" class="field focus-ring"></select>
          </div>
          <div>
            <label class="label">幼童</label>
            <select id="infant" class="field focus-ring"></select>
          </div>
        </div>
        <div class="grid grid-cols-3 gap-3">
          <div>
            <label class="label">大行李</label>
            <select id="checkedLuggage" class="field focus-ring"></select>
          </div>
          <div>
            <label class="label">登機箱</label>
            <select id="carryLuggage" class="field focus-ring"></select>
          </div>
          <div>
            <label class="label">座椅</label>
            <select id="seatCount" class="field focus-ring"></select>
          </div>
        </div>
      </div>
      <div class="card p-4 space-y-3">
        <div class="flex items-center justify-between">
          <h2 class="text-base font-semibold text-[#553f62]">加價與來回</h2>
          <label class="flex items-center gap-2 text-sm text-[#553f62]">
            <input id="hasReturn" type="checkbox" class="accent-[#553f62]">
            同時報價來回
          </label>
        </div>
        <label class="flex items-center gap-2 text-sm text-gray-700">
          <input id="signboard" type="checkbox" class="accent-[#553f62]">
          舉牌服務
        </label>
        <div>
          <label class="label">加點站（可新增多筆，沒有可留空）</label>
          <div id="extraStopsList" class="space-y-2 mt-1"></div>
          <button type="button" id="addExtraStopBtn" class="mt-2 w-full border border-dashed border-[#c9bccf] text-[#553f62] rounded-xl py-2 text-sm">＋ 新增加點</button>
        </div>
        <div id="returnBlock" class="hidden border-t border-gray-100 pt-3 space-y-3">
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="label">回程行程</label>
              <select id="returnServiceType" class="field focus-ring">
                <option value="接機">接機</option>
                <option value="送機">送機</option>
              </select>
            </div>
            <div>
              <label class="label">回程時間</label>
              <input id="returnTime" type="time" class="field focus-ring" value="18:00">
            </div>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="label">回程日期</label>
              <input id="returnDate" type="date" class="field focus-ring">
            </div>
            <div>
              <label class="label">回程地區</label>
              <input id="returnZone" list="zoneList" class="field focus-ring">
            </div>
          </div>
          <input id="returnAddress" class="field focus-ring" placeholder="回程地址文字">
        </div>
      </div>
      <div class="card p-4">
        <div class="flex items-center justify-between mb-2">
          <h2 class="text-base font-semibold text-[#553f62]">費用明細</h2>
          <button id="btnQuote" class="text-sm bg-[#553f62] text-white px-4 py-2 rounded-xl">取得報價</button>
        </div>
        <div id="feeList" class="text-gray-600 text-sm leading-relaxed">
          請先選擇地區後按「取得報價」。
        </div>
      </div>
      <div class="card p-4 bg-[#f8f5fa]">
        <h2 class="text-sm font-semibold text-[#553f62] mb-2">將提供給客人的文字</h2>
        <textarea id="quoteText" class="w-full min-h-[230px] bg-white border border-[#e6e2ea] rounded-xl p-3 text-sm leading-relaxed focus-ring" readonly></textarea>
      </div>
    </section>
  </main>
  <div id="imageRenderRoot" style="position:fixed;left:-9999px;top:0;"></div>
  <div class="bottom-bar">
    <div class="max-w-md mx-auto flex items-center gap-3">
      <div class="flex-1">
        <div class="text-xs text-gray-500">預估總額</div>
        <div id="totalText" class="text-2xl font-bold text-[#553f62]">$0</div>
      </div>
      <button id="btnImage" class="bg-white border border-[#553f62] text-[#553f62] px-4 py-3 rounded-xl font-semibold shadow-sm disabled:opacity-50" disabled>報價單圖片</button>
      <button id="btnCopy" class="bg-[#f07cad] text-white px-5 py-3 rounded-xl font-semibold shadow-sm disabled:opacity-50" disabled>複製報價</button>
    </div>
  </div>
  <script>
    const APP_VERSION = "quote-v1.0.10"; // 修正加點距離提示被自動填費用觸發的重畫洗掉的bug；報價單圖片改版：加上24小時效期＋非車輛保留聲明、分區塊(行程/乘車/費用資訊)、報價時間戳記
    const GAS_URL = "https://script.google.com/macros/s/AKfycbww3Pr0IcOABPvTteIWHo9j6MWRQvNjpf_MZRE7NgDp3Nt69Upx8VhVnCVMcbUvjJwI/exec";
    const BOOKING_URL = location.href.includes("quote.html") ? location.href.replace("quote.html", "index.html") : "index.html";
    let priceRows = [];
    let lastQuote = null;
    let extraStops = []; // {address, fee, feeManuallyEdited} 可疊加多筆，跟manual-booking.html的加點站清單同一套邏輯
    const $ = (id) => document.getElementById(id);

    // 跟 index.html calculateDistanceFee() 同一套公式：抓 Google 實際駕車距離，
    // 同縣市每5公里$100，跨縣市另外+$200底價。這裡是「自動幫客服算一個建議值」，
    // 客服還是可以直接覆蓋 extraStopFee 欄位，不會被鎖死。
    // 不再用 Google callback 機制（callback=xxx）綁地圖初始化，因為 callback 容易撞上腳本
    // 執行時機競速問題（之前就是這樣導致 initQuoteMapReady is not a function，整個地圖初始化失敗）。
    // 改成用 defer（不加 async），並且在 window 的 load 事件時才去綁地址自動完成，
    // 這時候 defer 腳本一定已經執行完、window.google.maps 一定存在。
    function initQuoteMapReady() {} // 地址自動完成改成綁在每個加點站的input上，見 renderExtraStops()

    // 跟 index.html calculateDistanceFee() 同一套公式：抓 Google 實際駕車距離，
    // 同縣市每5公里$100，跨縣市另外+$200底價。這裡是「自動幫客服算一個建議值」，
    // 客服還是可以直接覆蓋每一站的費用欄位，不會被鎖死。
    function renderExtraStops() {
      const wrap = $("extraStopsList");
      if (!extraStops.length) {
        wrap.innerHTML = '<div class="text-xs text-gray-400">尚未加入任何加點站</div>';
        return;
      }
      wrap.innerHTML = extraStops.map((stop, idx) => `
        <div class="border border-gray-200 rounded-xl p-2.5">
          <div class="grid grid-cols-[1fr_100px_36px] gap-2 items-center">
            <input type="text" value="${escapeQuoteHtml(stop.address)}" data-idx="${idx}" data-field="address" class="extra-stop-field field focus-ring !py-1.5 !text-sm" placeholder="加點地址">
            <input type="number" min="0" value="${stop.fee || ""}" data-idx="${idx}" data-field="fee" class="extra-stop-field field focus-ring !py-1.5 !text-sm" placeholder="費用">
            <button type="button" class="text-gray-400" data-remove-idx="${idx}" aria-label="刪除">✕</button>
          </div>
          <div class="text-xs text-gray-500 mt-1" data-stop-hint-idx="${idx}"></div>
        </div>`).join("");
      wrap.querySelectorAll(".extra-stop-field").forEach(el => {
        el.addEventListener("input", () => {
          const idx = Number(el.dataset.idx), field = el.dataset.field;
          extraStops[idx][field] = field === "fee" ? Number(el.value || 0) : el.value;
          if (field === "fee") extraStops[idx].feeManuallyEdited = true;
        });
        el.addEventListener("blur", () => {
          const idx = Number(el.dataset.idx);
          if (el.dataset.field === "address") calcExtraStopDistanceFee(idx);
        });
        if (el.dataset.field === "address" && window.google?.maps?.places?.Autocomplete) {
          try {
            const ac = new google.maps.places.Autocomplete(el, { componentRestrictions: { country: "tw" }, fields: ["formatted_address"] });
            ac.addListener("place_changed", () => {
              const place = ac.getPlace();
              const idx = Number(el.dataset.idx);
              if (place.formatted_address && extraStops[idx]) { extraStops[idx].address = place.formatted_address; el.value = place.formatted_address; }
              calcExtraStopDistanceFee(idx);
            });
          } catch (e) { console.warn("Google 地址自動完成無法使用：", e); }
        }
      });
      wrap.querySelectorAll("[data-remove-idx]").forEach(btn => {
        btn.addEventListener("click", () => { extraStops.splice(Number(btn.dataset.removeIdx), 1); renderExtraStops(); });
      });
    }
    function addExtraStop() {
      extraStops.push({ address: "", fee: 0, feeManuallyEdited: false });
      renderExtraStops();
    }
    function calcExtraStopDistanceFee(idx) {
      const hintEl = document.querySelector(`[data-stop-hint-idx="${idx}"]`);
      const addr1 = $("mainAddress").value.trim();
      const addr2 = (extraStops[idx] && extraStops[idx].address || "").trim();
      if (!hintEl) return;
      if (!addr1 || !addr2) { hintEl.textContent = ""; return; }
      if (!window.google?.maps?.DistanceMatrixService) { hintEl.textContent = "Google 地圖尚未載入完成，稍後再試"; return; }
      hintEl.textContent = "距離計算中…";
      // 防止卡死：正常情況下 Google 的 callback 一定會被呼叫（不管成功或失敗），
      // 如果 8 秒內都沒有任何回應，通常代表這把金鑰沒開通 Distance Matrix API 或網域被擋，
      // 這裡加一個逾時保底，至少畫面會顯示錯誤訊息，不會一直卡在「距離計算中」。
      let done = false;
      const timeoutId = setTimeout(() => {
        if (done) return;
        done = true;
        console.error("[加點距離計算] 8秒內未收到Google回應，可能是Distance Matrix API未啟用或金鑰網域限制");
        const el = document.querySelector(`[data-stop-hint-idx="${idx}"]`);
        if (el) el.textContent = "距離計算逾時，請直接手動輸入加點費";
      }, 8000);
      try {
        new google.maps.DistanceMatrixService().getDistanceMatrix(
          { origins: [addr1], destinations: [addr2], travelMode: "DRIVING", region: "tw" },
          (response, status) => {
            if (done) return;
            done = true;
            clearTimeout(timeoutId);
            const el = document.querySelector(`[data-stop-hint-idx="${idx}"]`);
            if (!el) return;
            if (status !== "OK" || !response || !response.rows[0] || response.rows[0].elements[0].status !== "OK") {
              console.error("[加點距離計算] Google回傳狀態異常：", status, response);
              el.textContent = `無法計算距離（${status || "未知錯誤"}），請確認地址是否正確或手動輸入`;
              return;
            }
            const distanceKm = response.rows[0].elements[0].distance.value / 1000;
            const isSameCity = addr1.substring(0, 3) === addr2.substring(0, 3);
            const units = Math.ceil(distanceKm / 5) || 1;
            const fee = isSameCity ? (units * 100) : (200 + units * 100);
            el.textContent = `實際駕車距離約 ${distanceKm.toFixed(1)} 公里，建議加點費 $${fee.toLocaleString()}`;
            if (extraStops[idx] && !extraStops[idx].feeManuallyEdited) {
              extraStops[idx].fee = fee;
              // 這裡不能整個重新renderExtraStops()，那樣會把上面剛寫好的距離提示文字整個洗掉
              // （提示元素會被重新建立成空的）。只直接更新費用輸入框的值就好，保留提示文字。
              const feeEl = document.querySelector(`.extra-stop-field[data-idx="${idx}"][data-field="fee"]`);
              if (feeEl) feeEl.value = fee;
            }
          }
        );
      } catch (err) {
        done = true;
        clearTimeout(timeoutId);
        console.error("[加點距離計算] 呼叫Google API時發生例外：", err);
        if (hintEl) hintEl.textContent = "距離計算發生錯誤，請直接手動輸入加點費";
      }
    }

    /**
     * 安全解析後端回應：GAS 額度不足、逾時、或服務忙碌時，Google 會回一頁 HTML 錯誤頁而不是 JSON，
     * 直接 r.json() 會丟出 "Unexpected token '<'" 這種看不懂的錯誤。這裡先讀成文字，
     * 解析失敗就丟出看得懂的訊息。
     */
    async function safeJsonParse(r) {
      const text = await r.text();
      try {
        return JSON.parse(text);
      } catch (err) {
        console.error("後端回應非 JSON 格式（可能是 Google 額度不足或服務忙碌），原始內容前200字：", text.slice(0, 200));
        throw new Error("系統忙碌中或連線異常，請稍後再試一次。");
      }
    }

    const money = (n, plus) => {
      const value = Number(n || 0);
      if (value < 0) return "-$" + Math.abs(value).toLocaleString("en-US");
      return (plus ? "+$" : "$") + value.toLocaleString("en-US");
    };
    const clean = (v) => String(v || "").trim();
    function fillNumberSelect(id, max, min = 0) {
      const el = $(id);
      el.innerHTML = "";
      for (let i = min; i <= max; i++) {
        const opt = document.createElement("option");
        opt.value = String(i);
        opt.textContent = String(i);
        el.appendChild(opt);
      }
    }
    async function loadPrices() {
      $("feeList").innerHTML = "報價資料載入中...";
      try {
        const data = await fetch(`${GAS_URL}?action=getPrices&t=${Date.now()}`).then(r => safeJsonParse(r));
        priceRows = data.prices || [];
        renderPriceOptions();
        $("feeList").innerHTML = "請先選擇地區後按「取得報價」。";
      } catch (err) {
        $("feeList").innerHTML = "報價資料載入失敗，請稍後再試。";
        Swal.fire("資料庫連線異常", err.message || "目前無法讀取報價資料庫。", "warning");
      }
    }
    function renderPriceOptions() {
      const airports = [...new Set(priceRows.map(r => clean(r.a)).filter(Boolean))];
      $("airport").innerHTML = airports.map(a => `<option value="${a}">${a}</option>`).join("") || `<option value="桃園機場">桃園機場</option>`;
      const zones = [...new Map(priceRows.map(r => [`${clean(r.b)} ${clean(r.c)}`.trim(), `${clean(r.b)} ${clean(r.c)}`.trim()])).values()].filter(Boolean);
      $("zoneList").innerHTML = zones.map(z => `<option value="${z}"></option>`).join("");
      if (!$("mainZone").value && zones.length) $("mainZone").value = zones[0];
      if (!$("returnZone").value && zones.length) $("returnZone").value = zones[0];
    }
    function buildPayload() {
      const paxText = `${$("adult").value}大 ${$("child").value}中 ${$("infant").value}小`;
      const luggageText = `${$("checkedLuggage").value}大 ${$("carryLuggage").value}登機`;
      const validStops = extraStops.filter(s => (s.address || "").trim() || s.fee > 0);
      const extraStopFee = validStops.reduce((sum, s) => sum + (Number(s.fee) || 0), 0);
      const extraAddress = validStops.map(s => s.address.trim()).filter(Boolean).join("、");
      return {
        channelCode: "AS",
        staffName: clean($("staffName").value),
        serviceType: $("serviceType").value,
        airport: $("airport").value,
        rideDate: $("rideDate").value,
        rideTime: $("rideTime").value,
        mainZone: clean($("mainZone").value),
        mainAddress: clean($("mainAddress").value),
        extraZone: "",
        extraAddress,
        extraStopFee,
        carType: $("carType").value,
        paxText,
        luggageText,
        seatCount: Number($("seatCount").value || 0),
        signboard: $("signboard").checked,
        hasReturn: $("hasReturn").checked,
        returnServiceType: $("returnServiceType").value,
        returnAirport: $("airport").value,
        returnDate: $("returnDate").value,
        returnTime: $("returnTime").value,
        returnZone: clean($("returnZone").value),
        returnAddress: clean($("returnAddress").value),
        appVersion: APP_VERSION
      };
    }
    function routeLine(type, airport, addressOrZone) {
      const place = clean(addressOrZone) || "接送地區";
      return type === "接機" ? `${airport} → ${place}` : `${place} → ${airport}`;
    }
    function formatQuoteDate(value) {
      if (!value) return "";
      const date = new Date(`${value}T00:00:00+08:00`);
      const normalized = String(value).replace(/-/g, "/");
      if (isNaN(date.getTime())) return normalized;
      const weeks = ["日", "一", "二", "三", "四", "五", "六"];
      return `${normalized} (${weeks[date.getDay()]})`;
    }
    function formatQuoteMoney(value, plus) {
      const n = Number(value || 0);
      if (n < 0) return `-NT$${Math.abs(n).toLocaleString("en-US")}`;
      return `${plus ? "+" : ""}NT$${n.toLocaleString("en-US")}`;
    }
    function buildQuoteFeeLines(items) {
      return (items || [])
        .filter(item => !item.isTotal && !String(item.label || "").includes("小計"))
        .map(item => {
          if (item.note) return `${item.label}｜${item.note}`;
          return `${item.label}｜${formatQuoteMoney(item.amount, item.isExtra)}`;
        });
    }
    function buildQuoteText(payload, result) {
      const lines = [];
      const divider = "━━━━━";
      lines.push("您好，感謝您諮詢安興專車接送。");
      lines.push("以下為您的行程參考報價：");
      lines.push("");
      lines.push("");
      lines.push("安興專車接送｜參考報價");
      lines.push(divider);
      lines.push("");
      lines.push("【行程資訊】");
      lines.push(`▪︎ 行程：${payload.serviceType}服務`);
      lines.push(`▪︎ 路線：${routeLine(payload.serviceType, payload.airport, payload.mainAddress || payload.mainZone)}`);
      if (payload.rideDate) lines.push(`▪︎ 日期：${formatQuoteDate(payload.rideDate)}`);
      if (payload.rideTime) lines.push(`▪︎ 時間：${payload.rideTime}`);
      lines.push(`▪︎ 車型：${payload.carType.replace("(SIENNA/BENZ V)", "")}`);
      lines.push(`▪︎ 人數：${payload.paxText}`);
      lines.push(`▪︎ 行李：${payload.luggageText}`);
      if (payload.extraAddress || payload.extraZone) lines.push(`▪︎ 加點：${payload.extraAddress || payload.extraZone}`);
      if (payload.hasReturn) {
        lines.push("");
        lines.push("【回程資訊】");
        lines.push(`▪︎ 行程：${payload.returnServiceType}服務`);
        lines.push(`▪︎ 路線：${routeLine(payload.returnServiceType, payload.airport, payload.returnAddress || payload.returnZone)}`);
        if (payload.returnDate) lines.push(`▪︎ 日期：${formatQuoteDate(payload.returnDate)}`);
        if (payload.returnTime) lines.push(`▪︎ 時間：${payload.returnTime}`);
      }
      lines.push("");
      lines.push(divider);
      lines.push("【費用明細】");
      lines.push("");
      buildQuoteFeeLines(result.items).forEach(line => {
        lines.push(line);
        lines.push("");
      });
      lines.push(`預估總額｜NT$${Number(result.total || 0).toLocaleString("en-US")}`);
      lines.push(divider);
      lines.push("");
      lines.push("");
      lines.push("📍以上為依據目前提供資訊試算之參考報價。");
      lines.push("實際費用仍將依完整上下車地址、是否加點、行李數量及實際安排車型後確認。");
      lines.push("");
      lines.push("");
      lines.push("📍本公司採預約保留制，完成預約後將為您安排車輛與司機。");
      lines.push("");
      lines.push("");
      lines.push("");
      lines.push("若此報價符合您的需求，歡迎透過官方 LINE 完成正式預約。");
      lines.push("首次透過系統預約，另享折扣碼優惠。");
      lines.push("");
      lines.push("官方 LINE 預約：");
      lines.push("https://page.line.me/ansing");
      lines.push("");
      lines.push("期待為您提供安全、舒適、準時的接送服務。");
      lines.push("");
      lines.push("安興專車接送｜深耕新竹・服務全台");
      lines.push("— 合法營運｜專業接送｜安心抵達 —");
      return lines.join("\n");
    }
    function renderQuote(payload, result) {
      lastQuote = { payload, result };
      const rows = (result.items || []).map(item => {
        if (item.note) return `<div class="money-row"><span>${item.label}</span><span>${item.note}</span></div>`;
        return `<div class="money-row ${item.isTotal ? "total" : ""}"><span>${item.label}</span><span>${money(item.amount, item.isExtra)}</span></div>`;
      }).join("");
      $("feeList").innerHTML = rows;
      $("totalText").textContent = `$${Number(result.total || 0).toLocaleString("en-US")}`;
      $("quoteText").value = buildQuoteText(payload, result);
      $("btnCopy").disabled = false;
      $("btnImage").disabled = false;
    }
    function escapeQuoteHtml(value) {
      return String(value || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    // 產生「給客人看」的報價單圖片：跟後台試算工具不一樣，這裡只放客人需要知道的資訊
    // （行程、費用明細、總額），不放客服備註、通路代碼這些內部欄位。
    function buildQuoteImageHtml(payload, result) {
      const rows = (result.items || []).map(item => {
        const value = item.note || money(item.amount, item.isExtra);
        return `<div style="display:flex;justify-content:space-between;padding:6px 0;font-size:13.5px;${item.isTotal ? "border-top:1px solid #e7ddea;margin-top:2px;padding-top:10px;font-weight:700;color:#553f62;font-size:15px;" : "color:#4b4553;"}"><span>${escapeQuoteHtml(item.label)}</span><span>${escapeQuoteHtml(value)}</span></div>`;
      }).join("");
      const route = routeLine(payload.serviceType, payload.airport, payload.mainAddress || payload.mainZone);
      const returnRoute = payload.hasReturn ? routeLine(payload.returnServiceType, payload.returnAirport, payload.returnAddress || payload.returnZone) : "";
      const now = new Date();
      const generatedAt = `${now.getFullYear()}/${String(now.getMonth() + 1).padStart(2, "0")}/${String(now.getDate()).padStart(2, "0")} ${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;
      const sectionLabel = (text) => `<div style="font-size:12px;font-weight:700;color:#993556;letter-spacing:1px;margin-bottom:6px;">${text}</div>`;
      return `
        <div style="width:420px;background:#fff;font-family:-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;">
          <div style="background:#553f62;padding:26px 26px 22px;text-align:center;color:#fff;">
            <div style="font-size:23px;font-weight:700;letter-spacing:2px;">安興租車</div>
            <div style="font-size:12.5px;opacity:.85;margin-top:5px;letter-spacing:1px;">機場接送．商務用車．包車旅遊</div>
            <div style="display:inline-block;margin-top:14px;background:rgba(255,255,255,.15);border-radius:20px;padding:5px 16px;font-size:12px;">預估報價單</div>
          </div>

          <div style="background:#FFF7EC;border-bottom:1px solid #F5E3C6;padding:12px 26px;text-align:center;">
            <div style="font-size:12.5px;color:#9a6a1f;font-weight:700;">⏰ 本報價單自產生起 24 小時內有效</div>
            <div style="font-size:11.5px;color:#b08a4a;margin-top:2px;">僅為預估費用參考，尚未完成正式預約，車輛與司機需另行預約保留</div>
          </div>

          <div style="padding:22px 26px;">
            <div style="display:flex;justify-content:space-between;font-size:11px;color:#a89fb0;margin-bottom:16px;">
              <span>報價時間：${generatedAt}</span>
              ${payload.staffName ? `<span>經辦：${escapeQuoteHtml(payload.staffName)}</span>` : ""}
            </div>

            ${sectionLabel("【行程資訊】")}
            <div style="border:1px solid #e7ddea;border-radius:10px;padding:14px 16px;margin-bottom:18px;">
              <div style="font-size:13px;color:#8a8291;margin-bottom:4px;">${escapeQuoteHtml(formatQuoteDate(payload.rideDate))} ${escapeQuoteHtml(payload.rideTime)}</div>
              <div style="font-size:16px;font-weight:700;color:#1A0B3D;">${escapeQuoteHtml(payload.serviceType)}｜${escapeQuoteHtml(payload.carType)}</div>
              <div style="font-size:13.5px;color:#4b4553;margin-top:3px;">${escapeQuoteHtml(route)}</div>
              ${payload.hasReturn ? `<div style="border-top:1px dashed #e7ddea;margin-top:10px;padding-top:10px;"><div style="font-size:12px;color:#8a8291;">回程　${escapeQuoteHtml(formatQuoteDate(payload.returnDate))} ${escapeQuoteHtml(payload.returnTime)}</div><div style="font-size:13.5px;color:#4b4553;margin-top:2px;">${escapeQuoteHtml(returnRoute)}</div></div>` : ""}
              ${payload.extraAddress ? `<div style="font-size:12.5px;color:#8a8291;margin-top:8px;">加點：${escapeQuoteHtml(payload.extraAddress)}</div>` : ""}
            </div>

            ${sectionLabel("【乘車資訊】")}
            <div style="margin-bottom:18px;">
              <div style="display:flex;justify-content:space-between;font-size:13px;color:#4b4553;padding:3px 0;"><span>人數</span><span>${escapeQuoteHtml(payload.paxText)}</span></div>
              <div style="display:flex;justify-content:space-between;font-size:13px;color:#4b4553;padding:3px 0;"><span>行李</span><span>${escapeQuoteHtml(payload.luggageText)}</span></div>
              ${payload.seatCount ? `<div style="display:flex;justify-content:space-between;font-size:13px;color:#4b4553;padding:3px 0;"><span>安全座椅</span><span>${payload.seatCount}個</span></div>` : ""}
              ${payload.signboard ? `<div style="display:flex;justify-content:space-between;font-size:13px;color:#4b4553;padding:3px 0;"><span>舉牌服務</span><span>需要</span></div>` : ""}
            </div>

            ${sectionLabel("【費用明細】")}
            <div>${rows}</div>

            <div style="margin-top:16px;display:flex;justify-content:space-between;align-items:baseline;background:#FBF7FA;border-radius:10px;padding:16px 18px;">
              <span style="font-size:14px;font-weight:600;color:#553f62;">預估總額</span>
              <span style="font-size:26px;font-weight:700;color:#993556;">$${Number(result.total || 0).toLocaleString("en-US")}</span>
            </div>
            <div style="font-size:11px;color:#a89fb0;margin-top:12px;line-height:1.6;">＊實際費用仍將依完整上下車地址、是否加點、行李數量及實際安排車型後確認。</div>
          </div>

          <div style="background:#FBF7FA;padding:14px 26px;font-size:11px;color:#8a8291;text-align:center;">如報價無誤，歡迎透過官方 LINE 完成正式預約｜合法營運．專業接送．安心抵達</div>
        </div>`;
    }
    async function generateQuoteImage() {
      if (!lastQuote) return;
      const btn = $("btnImage");
      btn.disabled = true;
      const originalText = btn.textContent;
      btn.textContent = "產生中...";
      try {
        const root = $("imageRenderRoot");
        root.innerHTML = buildQuoteImageHtml(lastQuote.payload, lastQuote.result);
        await new Promise(r => setTimeout(r, 50));
        const canvas = await html2canvas(root.firstElementChild, { scale: 2, backgroundColor: "#ffffff" });
        const dataUrl = canvas.toDataURL("image/png");
        await Swal.fire({
          imageUrl: dataUrl,
          imageAlt: "報價單",
          imageWidth: 320,
          title: "報價單圖片",
          confirmButtonText: "下載圖片",
          confirmButtonColor: "#553f62",
          showCancelButton: true,
          cancelButtonText: "關閉",
          width: "min(94vw, 420px)"
        }).then(r => {
          if (r.isConfirmed) {
            const a = document.createElement("a");
            a.href = dataUrl;
            a.download = `安興租車報價單-${lastQuote.payload.rideDate || ""}.png`;
            a.click();
          }
        });
      } catch (err) {
        console.error("[報價單圖片] 產生失敗：", err);
        Swal.fire("圖片產生失敗", "請稍後再試，或直接用文字版複製給客人。", "error");
      } finally {
        btn.disabled = false;
        btn.textContent = originalText;
      }
    }
    async function getQuote() {
      const payload = buildPayload();
      if (!payload.mainZone) return Swal.fire("請選擇主要地區", "快速報價需要先選擇地區，才抓得到資料庫價格。", "info");
      $("btnQuote").disabled = true;
      $("btnQuote").textContent = "試算中...";
      try {
        const res = await fetch(GAS_URL, {
          method: "POST",
          body: JSON.stringify({ action: "quickQuote", data: payload })
        }).then(r => safeJsonParse(r));
        if (!res.success) throw new Error(res.error || "無法取得報價");
        renderQuote(payload, res);
      } catch (err) {
        Swal.fire("報價失敗", err.message || "請稍後再試。", "error");
      } finally {
        $("btnQuote").disabled = false;
        $("btnQuote").textContent = "取得報價";
      }
    }
    async function copyQuote() {
      if (!lastQuote) return;
      const text = $("quoteText").value;
      try {
        await navigator.clipboard.writeText(text);
      } catch (err) {
        $("quoteText").select();
        document.execCommand("copy");
      }
      fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "saveQuickQuote",
          data: { ...lastQuote.payload, result: lastQuote.result, quoteText: text, appVersion: APP_VERSION }
        })
      }).catch(() => {});
      Swal.fire({ title: "已複製", text: "可以直接貼到 LINE、IG、Messenger 或簡訊給客人。", icon: "success", timer: 1400, showConfirmButton: false });
    }
    function init() {
      $("versionText").textContent = APP_VERSION;
      fillNumberSelect("adult", 7, 1);
      fillNumberSelect("child", 3, 0);
      fillNumberSelect("infant", 2, 0);
      fillNumberSelect("checkedLuggage", 7, 0);
      fillNumberSelect("carryLuggage", 4, 0);
      fillNumberSelect("seatCount", 4, 0);
      const today = new Date();
      const tomorrow = new Date(today.getTime() + 24 * 60 * 60 * 1000);
      $("rideDate").value = tomorrow.toISOString().slice(0, 10);
      $("returnDate").value = tomorrow.toISOString().slice(0, 10);
      $("hasReturn").addEventListener("change", () => $("returnBlock").classList.toggle("hidden", !$("hasReturn").checked));
      $("serviceType").addEventListener("change", () => {
        $("returnServiceType").value = $("serviceType").value === "送機" ? "接機" : "送機";
      });
      $("btnQuote").addEventListener("click", getQuote);
      $("btnCopy").addEventListener("click", copyQuote);
      $("btnImage").addEventListener("click", generateQuoteImage);
      $("btnReload").addEventListener("click", loadPrices);
      $("addExtraStopBtn").addEventListener("click", addExtraStop);
      $("mainAddress").addEventListener("blur", () => extraStops.forEach((_, idx) => calcExtraStopDistanceFee(idx)));
      renderExtraStops();
      loadPrices();
    }
    window.addEventListener("load", init);
  </script>
</body>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>行程確認</title>
<style>
  /* confirm.html v1.0.0：行程確認連結(客人看)。抬頭／窗口照「來源設定」，不寫死任何公司名稱。需 gas v2.2.507 */
  :root { --p:#553F62; --b:#C2416B; --bd:#A8345A; --bs:#FDF0F4; --bl:#F3C6D5; --bg:#F5F5F7; --g:#8E8E93; --line:#E2E2E4; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:#2b2530; font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif; font-size:14px; }
  .wrap { max-width:480px; margin:0 auto; padding-bottom:28px; }
  .hd { background:var(--p); color:#fff; padding:18px 18px 16px; }
  .hd small { display:block; font-size:12px; opacity:.85; letter-spacing:1px; }
  .hd h1 { font-size:22px; font-weight:900; margin-top:2px; }
  .hd .hi { font-size:13px; margin-top:4px; }
  .box { background:#fff; margin:12px 12px 0; border-radius:14px; padding:12px 14px; }
  .sum b { font-size:18px; color:var(--p); }
  .sum .r { display:flex; justify-content:space-between; color:#5F5868; margin-top:3px; font-size:13px; }
  .day { font-weight:900; color:var(--bd); font-size:13px; margin:14px 16px 0; }
  .trip { background:#fff; margin:6px 12px 0; border-radius:14px; padding:11px 13px; line-height:1.6; font-size:13px; }
  .trip.x { opacity:.5; }
  .tt { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .tm { font-size:17px; font-weight:900; color:var(--p); }
  .tag { font-size:11px; font-weight:800; border-radius:999px; padding:1px 8px; white-space:nowrap; }
  .t1 { background:#F0EDF2; color:var(--p); } .t2 { background:var(--bs); color:var(--bd); border:1px solid var(--bl); } .t3 { background:#F3F4F6; color:#6B7280; }
  .rt { font-weight:700; margin-top:2px; }
  .kv { color:#5F5868; } .kv b { color:#2b2530; font-weight:600; }
  .car { display:flex; justify-content:space-between; gap:8px; border-top:1px dashed #EEE; margin-top:6px; padding-top:6px; font-weight:800; }
  .pay { color:var(--bd); }
  .id { font-size:11px; color:#9CA3AF; margin-top:3px; word-break:break-all; }
  .btn { display:block; width:calc(100% - 24px); margin:10px 12px 0; border:0; border-radius:12px; padding:13px; font-size:15px; font-weight:900; cursor:pointer; }
  .btn.p { background:var(--p); color:#fff; } .btn.o { background:#fff; color:var(--p); border:1.5px solid var(--p); }
  .btn:disabled { opacity:.5; }
  .state { text-align:center; border:2px solid var(--p); }
  .state b { display:block; font-size:17px; color:var(--p); margin-bottom:4px; }
  .state span { font-size:12.5px; color:#5F5868; line-height:1.7; }
  .state.chg { border-color:var(--b); } .state.chg b { color:var(--bd); }
  textarea { width:100%; border:1.5px solid var(--line); border-radius:10px; padding:10px; font-size:14px; font-family:inherit; margin-top:8px; }
  .ft { text-align:center; font-size:12px; color:#5F5868; margin:16px 16px 0; line-height:1.8; }
  .msg { text-align:center; color:var(--g); padding:60px 20px; line-height:1.8; }
  .err { color:var(--bd); font-size:12.5px; text-align:center; margin-top:8px; }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="msg">讀取中…</div></div>
<script>
  const GAS_URL = "https://script.google.com/macros/s/AKfycbz6wgk6T8ypEI1pW5ih7M3Bom54Tu7unv-sc_ldFtPSBWw4yAbahs70GErKGpsRqcG3/exec";
  const APP_VERSION = "v1.0.0";
  const k = new URLSearchParams(location.search).get("k") || "";
  const app = document.getElementById("app");
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const money = n => "$" + (Number(n) || 0).toLocaleString();
  const md = d => { const p = String(d).split(/[-\/]/); return p.length >= 3 ? `${p[1]}/${p[2]}` : d; };
  const wk = d => { const p = String(d).split(/[-\/]/).map(Number); const w = new Date(p[0], p[1] - 1, p[2]).getDay(); return isNaN(w) ? "" : "(" + "日一二三四五六"[w] + ")"; };
  const fl = f => { const parts = String(f || "").split("｜").map(x => x.trim()).filter(Boolean); const term = parts.filter(x => /^T\d$/i.test(x)); const nums = parts.filter(x => !/^T\d$/i.test(x)); return nums.length ? nums.join(" ") + (term.length ? `(${term.join("")})` : "") : (term.length ? `航廈${term.join("")}` : ""); };
  const signOf = o => String(o.signboard || "").replace(/^\s*舉牌\s*[:：]\s*/, "").trim();
  let data = null, showChange = false, busy = false;

  async function load() {
    if (!k) { app.innerHTML = '<div class="msg">連結不完整，請跟窗口重新索取。</div>'; return; }
    try {
      const res = await fetch(`${GAS_URL}?action=getTripConfirm&k=${encodeURIComponent(k)}&t=${Date.now()}`);
      data = JSON.parse(await res.text());
    } catch (e) { app.innerHTML = '<div class="msg">連線失敗，請稍後重新整理。</div>'; return; }
    render();
  }
  function head() {
    const b = (data && data.brand) || {};
    if (b.title) document.title = b.title + "｜行程確認";
    return `<div class="hd">${b.title ? `<small>${esc(b.title)}</small>` : ""}<h1>行程確認</h1>${data && data.name ? `<div class="hi">${esc(data.name)} 您好</div>` : ""}</div>`;
  }
  function foot() {
    const b = (data && data.brand) || {};
    const ct = [b.contact, b.phone].filter(Boolean).join(" ");
    if (!ct && !b.lineId) return "";
    const tel = b.phone ? `<a href="tel:${esc(String(b.phone).replace(/[^\d+]/g, ""))}" style="color:var(--p);font-weight:800">${esc(b.phone)}</a>` : "";
    return `<div class="ft">聯絡窗口：${esc(b.contact || "")} ${tel}${b.lineId ? "｜LINE ID " + esc(b.lineId) : ""}</div>`;
  }
  function render() {
    if (!data || !data.success) { app.innerHTML = (data && data.brand ? head() : "") + `<div class="msg">${esc((data && data.error) || "讀取失敗，請稍後重新整理。")}</div>` + (data && data.brand ? foot() : ""); return; }
    const trips = data.trips || [];
    const live = trips.filter(o => !o.cancelled);
    const total = live.reduce((s, o) => s + (Number(o.amount) || 0), 0);
    const pays = [...new Set(live.map(o => String(o.payment || "").trim()))];
    const payRows = pays.length === 1 ? `<div class="r"><span>付款方式</span><span>${esc(pays[0] || "—")}</span></div>`
      : pays.map(pm => { const g = live.filter(o => String(o.payment || "").trim() === pm); return `<div class="r"><span>${esc(pm || "未填")} ${g.length}趟</span><span>${money(g.reduce((s, o) => s + (Number(o.amount) || 0), 0))}</span></div>`; }).join("");
    // 同時間、同行程、同車型、同金額的多台車合併
    const groups = [];
    trips.forEach(o => { const key = [o.date, o.time, o.type, o.route, o.car, o.amount, o.payment, o.flight, o.paxName, signOf(o), o.remarks, o.cancelled, o.updated].join("|"); const g = groups.find(x => x.key === key); if (g) g.items.push(o); else groups.push({ key, items: [o] }); });
    let lastDate = "";
    const tripsHtml = groups.map(g => {
      const o = g.items[0], n = g.items.length;
      const dh = o.date !== lastDate ? `<div class="day">${esc(md(o.date))}${esc(wk(o.date))}</div>` : "";
      lastDate = o.date;
      const f = fl(o.flight);
      const kv = (t, v) => v ? `<div class="kv">${t} <b>${esc(v)}</b></div>` : "";
      const tags = (o.cancelled ? '<span class="tag t3">已取消</span> ' : "") + (o.updated && !o.cancelled ? '<span class="tag t2">已更新</span> ' : "") + `<span class="tag t1">${esc(o.type)}</span>`;
      const ids = g.items.map(x => x.orderId);
      return `${dh}<div class="trip${o.cancelled ? " x" : ""}"><div class="tt"><span class="tm">${esc(o.time)}</span><span>${tags}</span></div>
        <div class="rt">${esc(String(o.route || "").replace(/\s*→\s*/g, " → "))}</div>
        ${f ? `<div class="kv">${/^航廈/.test(f) ? esc(f) : "航班 " + esc(f)}</div>` : ""}
        ${kv("乘車人", o.paxName)}${kv("舉牌", signOf(o))}${kv("備註", o.remarks)}
        <div class="car"><span>${esc(o.car || "")}${n > 1 ? "×" + n + "台" : ""}</span><span>${n > 1 ? "每台" : ""}${money(o.amount)}${pays.length > 1 && o.payment ? `｜<span class="pay">${esc(o.payment)}</span>` : ""}</span></div>
        <div class="id">${esc(ids.join("、"))}</div></div>`;
    }).join("");
    const anyUpdated = trips.some(o => o.updated && !o.cancelled);
    let stateHtml = "";
    if (data.status === "已確認" && !anyUpdated) stateHtml = `<div class="box state"><b>✅ 已確認，謝謝您！</b><span>確認時間 ${esc(data.confirmedAt)}<br>行程若有異動，這個頁面會自動更新</span></div>`;
    else if (data.status === "已確認" && anyUpdated) stateHtml = `<div class="box state chg"><b>行程有更新</b><span>標「已更新」的車趟內容有變動，請再確認一次</span></div>`;
    else if (data.status === "要修改") stateHtml = `<div class="box state chg"><b>已收到您的修改需求</b><span>${esc(data.changedAt)}「${esc(data.changeNote)}」<br>窗口會盡快與您聯繫，修改完成後請再確認一次</span></div>`;
    const showBtns = !(data.status === "已確認" && !anyUpdated);
    const btns = showBtns ? (showChange
      ? `<div class="box"><b style="color:var(--p)">請寫要修改的內容</b><textarea id="note" rows="4" placeholder="例如：12/03 15:05 那趟改成 15:30"></textarea></div>
         <button class="btn p" id="sendChg">送出修改需求</button><button class="btn o" id="back">返回</button>`
      : `<button class="btn p" id="ok">✅ 確認無誤</button><button class="btn o" id="chg">✏️ 需要修改</button>`) : "";
    app.innerHTML = head() + stateHtml + `<div class="box sum"><b>共${live.length}趟｜合計${money(total)}</b>${payRows}</div>` + tripsHtml + btns + '<div class="err" id="err"></div>' + foot();
    const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
    on("ok", () => submit("confirm", ""));
    on("chg", () => { showChange = true; render(); });
    on("back", () => { showChange = false; render(); });
    on("sendChg", () => { const t = (document.getElementById("note") || {}).value || ""; if (!t.trim()) { document.getElementById("err").textContent = "請寫要修改的內容"; return; } submit("change", t.trim()); });
  }
  async function submit(act, note) {
    if (busy) return; busy = true;
    document.querySelectorAll(".btn").forEach(b => b.disabled = true);
    try {
      const res = await fetch(GAS_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "submitTripConfirm", data: { k, act, note } }) });
      const r = JSON.parse(await res.text());
      if (!r.success) throw new Error(r.error || "送出失敗");
      showChange = false; busy = false; await load(); window.scrollTo(0, 0);
    } catch (e) {
      busy = false; document.querySelectorAll(".btn").forEach(b => b.disabled = false);
      const el = document.getElementById("err"); if (el) el.textContent = (e.message || "送出失敗") + "，請稍後再試一次";
    }
  }
  load();
</script>
</body>
</html>

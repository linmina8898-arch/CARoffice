<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>安興租車｜TouchGo 風格 UI 測試 v3.1</title>
  <style>
    :root {
      --ink: #1a0b3d;
      --purple: #574266;
      --muted: #7a6a82;
      --line: #dfd3e5;
      --wash: #f8f4f8;
      --pink: #d9578d;
      --soft-pink: #fff5fa;
      --white: #fff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: #f7f4f8;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      font-size: 14px;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .app {
      width: min(100%, 520px);
      min-height: 100vh;
      margin: 0 auto;
      padding: 20px 16px 118px;
      background: #fff;
    }
    .topline {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      border-bottom: 1px solid #eee6f0;
      padding-bottom: 16px;
    }
    .brand { font-size: 19px; font-weight: 700; letter-spacing: 0; }
    .version { color: var(--muted); font-size: 11px; font-weight: 400; }
    .eyebrow { color: var(--muted); margin: 20px 0 8px; font-size: 12px; }
    h1 { margin: 0; font-size: 20px; }
    .trip-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 6px;
      margin: 18px 0;
      border-radius: 10px;
      background: #f5f0f6;
    }
    .trip-switch button {
      min-height: 46px;
      color: var(--muted);
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      font-weight: 600;
    }
    .trip-switch button.active {
      color: #fff;
      background: var(--purple);
      box-shadow: 0 2px 6px rgba(87, 66, 102, .16);
    }
    .panel {
      margin-top: 14px;
      padding: 16px;
      border: 1px solid #e8dfe9;
      border-radius: 12px;
      background: var(--white);
    }
    .panel h2 {
      margin: 0 0 14px;
      color: var(--purple);
      font-size: 15px;
    }
    .field { margin-top: 12px; }
    .field:first-child { margin-top: 0; }
    label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 12px; }
    input, select {
      width: 100%;
      min-height: 46px;
      padding: 0 12px;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }
    .route-row {
      position: relative;
      padding-left: 18px;
    }
    .route-row::before {
      position: absolute;
      left: 0;
      top: 34px;
      width: 8px;
      height: 8px;
      border: 2px solid var(--pink);
      border-radius: 50%;
      content: "";
    }
    .route-row::after {
      position: absolute;
      top: 51px;
      bottom: -8px;
      left: 4px;
      border-left: 1px dashed #d7c8dc;
      content: "";
    }
    .route-row:last-child::after { display: none; }
    .route-row:last-child::before { border-color: var(--purple); border-radius: 2px; }
    .time-trigger {
      display: flex;
      width: 100%;
      min-height: 74px;
      padding: 13px 14px;
      text-align: left;
      border: 1px solid #dbcde1;
      border-radius: 10px;
      background: #fff;
    }
    .time-trigger strong { display: block; margin: 2px 0; font-size: 17px; }
    .time-trigger span { color: var(--muted); font-size: 12px; }
    .time-trigger .chevron { margin-left: auto; align-self: center; color: var(--purple); font-size: 22px; }
    .flight-note { margin: 7px 0 0; color: var(--pink); font-size: 12px; line-height: 1.45; }
    .three-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .two-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .capacity-note {
      margin: 12px 0 0;
      padding: 10px;
      color: var(--muted);
      border-radius: 8px;
      background: var(--wash);
      font-size: 12px;
      line-height: 1.5;
    }
    .car-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 8px;
      padding: 13px;
      border: 1px solid #e4d8e7;
      border-radius: 9px;
      background: #fff;
    }
    .car-card.selected { border: 2px solid var(--purple); background: #fcfaff; }
    .car-card small { display: block; margin-top: 3px; color: var(--muted); }
    .car-card button {
      min-width: 58px;
      min-height: 32px;
      color: var(--purple);
      border: 1px solid #cdbbd3;
      border-radius: 7px;
      background: #fff;
    }
    .car-card.selected button { color: #fff; border-color: var(--purple); background: var(--purple); }
    .quote-bar {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 520px;
      min-height: 95px;
      margin: 0 auto;
      padding: 14px 16px;
      border: 1px solid #cdbbd3;
      border-bottom: 0;
      border-radius: 14px 14px 0 0;
      background: #fff;
      box-shadow: 0 -5px 18px rgba(52, 34, 65, .11);
    }
    .quote-bar span { display: block; color: var(--muted); font-size: 12px; }
    .quote-bar strong { color: var(--ink); font-size: 24px; }
    .quote-bar button, .sheet-confirm {
      min-height: 46px;
      padding: 0 18px;
      color: #fff;
      border: 0;
      border-radius: 8px;
      background: var(--purple);
      font-weight: 700;
    }
    .backdrop {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: none;
      align-items: flex-end;
      background: rgba(26, 11, 61, .38);
    }
    .backdrop.open { display: flex; }
    .sheet {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 12px 18px 24px;
      border-radius: 22px 22px 0 0;
      background: #fff;
      box-shadow: 0 -10px 30px rgba(26, 11, 61, .16);
    }
    .handle { width: 42px; height: 4px; margin: 0 auto 20px; border-radius: 99px; background: #ddd3df; }
    .sheet h2 { margin: 0 0 20px; font-size: 22px; }
    .picker-grid { display: grid; grid-template-columns: 1.5fr 1fr 1fr; gap: 8px; }
    .picker-grid select {
      min-height: 58px;
      text-align: center;
      font-size: 16px;
      font-weight: 700;
      background: #faf7fb;
    }
    .sheet-confirm { width: 100%; margin-top: 22px; border-radius: 99px; font-size: 17px; }
    @media (max-width: 360px) {
      .app { padding-right: 12px; padding-left: 12px; }
      .panel { padding: 13px; }
      .three-grid { gap: 6px; }
      input, select { padding: 0 8px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="topline">
      <div class="brand">安興租車｜詢價/預約系統</div>
      <div class="version">UI 測試 v3.1｜時間選擇版</div>
    </div>
    <p class="eyebrow">快速估價</p>
    <h1>先確認行程與上車時間</h1>

    <div class="trip-switch" aria-label="服務類型">
      <button class="active" type="button" data-trip="送機">送機</button>
      <button type="button" data-trip="接機">接機</button>
    </div>

    <section class="panel">
      <h2>行程路線</h2>
      <div class="route-row field">
        <label id="originLabel" for="origin">上車地點</label>
        <input id="origin" placeholder="輸入完整地址後選擇 Google 搜尋結果">
      </div>
      <div class="route-row field">
        <label id="destinationLabel" for="destination">送機地點</label>
        <input id="destination" value="桃園機場" placeholder="選擇目的地">
      </div>
    </section>

    <section class="panel">
      <h2>乘車時間</h2>
      <button id="timeTrigger" class="time-trigger" type="button">
        <span>
          <label>日期與時間</label>
          <strong id="timeSummary">請選擇日期與時間</strong>
          <span>點選後可分別選擇日期、時、分</span>
        </span>
        <span class="chevron">›</span>
      </button>
      <div class="field">
        <label id="flightLabel" for="flight">出發航班編號</label>
        <input id="flight" maxlength="12" placeholder="例如 BR123" autocomplete="off">
        <p id="flightHelp" class="flight-note">送機請填出發航班；接機請填抵台航班。</p>
      </div>
    </section>

    <section class="panel">
      <h2>乘客與行李</h2>
      <div class="three-grid">
        <div><label for="adult">大人</label><select id="adult"></select></div>
        <div><label for="child">小孩 (4-12)</label><select id="child"></select></div>
        <div><label for="infant">幼童 (0-4)</label><select id="infant"></select></div>
      </div>
      <div class="two-grid field">
        <div><label for="checked">托運箱 (21-29吋)</label><select id="checked"></select></div>
        <div><label for="carry">登機箱</label><select id="carry"></select></div>
      </div>
      <p class="capacity-note">依實際人數與行李推薦車型；若超過車型乘載，系統只會協助往上調整車型。</p>
    </section>

    <section class="panel">
      <h2>建議車型</h2>
      <div id="vehicleList"></div>
    </section>
  </main>

  <footer class="quote-bar">
    <div><span>預估費用明細 / 總額</span><strong id="quote">$0</strong></div>
    <button type="button">下一步</button>
  </footer>

  <div id="backdrop" class="backdrop" aria-hidden="true">
    <div class="sheet" role="dialog" aria-modal="true" aria-label="選擇上車時間">
      <div class="handle"></div>
      <h2>選擇上車時間</h2>
      <div class="picker-grid">
        <div><label for="pickDate">日期</label><select id="pickDate"></select></div>
        <div><label for="pickHour">時</label><select id="pickHour"></select></div>
        <div><label for="pickMinute">分</label><select id="pickMinute"></select></div>
      </div>
      <button id="confirmTime" class="sheet-confirm" type="button">確認時間</button>
    </div>
  </div>

  <script>
    const state = { trip: "送機", date: null, hour: "09", minute: "00", vehicle: "小車" };
    const week = ["日", "一", "二", "三", "四", "五", "六"];
    const $ = (id) => document.getElementById(id);

    function addOptions(id, max, suffix) {
      const el = $(id);
      for (let i = 0; i <= max; i += 1) {
        const option = document.createElement("option");
        option.value = i;
        option.textContent = i + suffix;
        el.appendChild(option);
      }
    }
    ["adult", "child", "infant"].forEach((id) => addOptions(id, 7, ""));
    ["checked", "carry"].forEach((id) => addOptions(id, 8, ""));
    $("adult").value = "1";

    function formatDate(date) {
      return (date.getMonth() + 1) + "月" + date.getDate() + "日 週" + week[date.getDay()];
    }
    function populateTime() {
      const now = new Date();
      now.setHours(0, 0, 0, 0);
      for (let i = 0; i < 30; i += 1) {
        const d = new Date(now);
        d.setDate(now.getDate() + i);
        const option = document.createElement("option");
        option.value = d.toISOString().slice(0, 10);
        option.textContent = formatDate(d);
        $("pickDate").appendChild(option);
      }
      state.date = $("pickDate").value;
      for (let h = 0; h < 24; h += 1) {
        const option = document.createElement("option");
        option.value = String(h).padStart(2, "0");
        option.textContent = option.value + " 時";
        $("pickHour").appendChild(option);
      }
      [0, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55].forEach((m) => {
        const option = document.createElement("option");
        option.value = String(m).padStart(2, "0");
        option.textContent = option.value + " 分";
        $("pickMinute").appendChild(option);
      });
      $("pickHour").value = state.hour;
      $("pickMinute").value = state.minute;
    }
    function updateTime() {
      const d = new Date(state.date + "T00:00:00");
      $("timeSummary").textContent = (d.getMonth() + 1) + "/" + d.getDate() + "（" + week[d.getDay()] + "） " + state.hour + ":" + state.minute;
      $("confirmTime").textContent = "確認：" + $("timeSummary").textContent;
    }
    function setTrip(trip) {
      state.trip = trip;
      document.querySelectorAll("[data-trip]").forEach((button) => button.classList.toggle("active", button.dataset.trip === trip));
      const send = trip === "送機";
      $("originLabel").textContent = send ? "上車地點" : "接機地點";
      $("destinationLabel").textContent = send ? "送機地點" : "下車地點";
      $("destination").value = send ? "桃園機場" : "";
      $("destination").placeholder = send ? "選擇機場" : "輸入完整送達地址";
      $("flightLabel").textContent = send ? "出發航班編號" : "抵台航班編號";
      $("flightHelp").textContent = send ? "送機請填出發航班，例如 BR123。" : "接機請填抵台航班，例如 BR123。";
    }

    const vehicles = [
      { name: "小車", note: "限 3 人 2 件", price: 1300, people: 3, bags: 2 },
      { name: "大車", note: "限 7 人 7 件", price: 1800, people: 7, bags: 7 },
      { name: "進口商務車", note: "舒適乘坐", price: 2200, people: 6, bags: 5 },
      { name: "New Alphard 40系", note: "限 4 人 3 件", price: 2800, people: 4, bags: 3 }
    ];
    function renderVehicles() {
      const people = +$("adult").value + +$("child").value + +$("infant").value;
      const bags = +$("checked").value + +$("carry").value;
      const list = $("vehicleList");
      list.innerHTML = "";
      const permitted = vehicles.filter((car) => car.people >= people && car.bags >= bags);
      if (!permitted.some((car) => car.name === state.vehicle)) state.vehicle = permitted[0] ? permitted[0].name : "大車";
      vehicles.forEach((car) => {
        const allowed = car.people >= people && car.bags >= bags;
        const row = document.createElement("div");
        row.className = "car-card" + (car.name === state.vehicle ? " selected" : "");
        row.innerHTML = "<div><strong>" + car.name + "</strong><small>" + car.note + "</small></div><button type='button'" + (allowed ? "" : " disabled") + ">" + (car.name === state.vehicle ? "已選" : allowed ? "選擇" : "不符") + "</button>";
        row.querySelector("button").addEventListener("click", () => { if (allowed) { state.vehicle = car.name; renderVehicles(); } });
        list.appendChild(row);
      });
      const selected = vehicles.find((car) => car.name === state.vehicle);
      $("quote").textContent = "$" + (selected ? selected.price.toLocaleString("zh-TW") : "0");
    }

    document.querySelectorAll("[data-trip]").forEach((button) => button.addEventListener("click", () => setTrip(button.dataset.trip)));
    $("timeTrigger").addEventListener("click", () => $("backdrop").classList.add("open"));
    $("backdrop").addEventListener("click", (event) => { if (event.target === $("backdrop")) $("backdrop").classList.remove("open"); });
    $("confirmTime").addEventListener("click", () => {
      state.date = $("pickDate").value;
      state.hour = $("pickHour").value;
      state.minute = $("pickMinute").value;
      updateTime();
      $("backdrop").classList.remove("open");
    });
    $("flight").addEventListener("input", (event) => { event.target.value = event.target.value.toUpperCase().replace(/\s/g, ""); });
    ["adult", "child", "infant", "checked", "carry"].forEach((id) => $(id).addEventListener("change", renderVehicles));

    populateTime();
    updateTime();
    renderVehicles();
  </script>
</body>
</html>
